name: Rust CI and releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            manifest: mali/Cargo.toml
            binary: laya-mali
            asset: laya-mali-linux-aarch64-glibc2.35
          - runner: ubuntu-22.04-arm
            manifest: npu/Cargo.toml
            binary: laya-rknpu
            asset: laya-rknpu-linux-aarch64-glibc2.35
    env:
      CARGO_TARGET_DIR: target/${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --manifest-path "${{ matrix.manifest }}" --all -- --check
      - name: Test
        run: cargo +1.98.1 test --manifest-path "${{ matrix.manifest }}" --locked
      - name: Build release binary
        run: cargo +1.98.1 build --manifest-path "${{ matrix.manifest }}" --locked --release --bin "${{ matrix.binary }}"
      - name: Package release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/package
          install -m 0755 "$CARGO_TARGET_DIR/release/${{ matrix.binary }}" "dist/package/${{ matrix.binary }}"
          cp LICENSE .github/ASSET-README.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.asset }}.tar.gz" .
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file .github/RELEASE_NOTES.md
